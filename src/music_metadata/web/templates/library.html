{% extends "base.html" %}
{% block title %}library · music-metadata{% endblock %}
{% block content %}
    <h1>library</h1>
    <form class="filters"
          role="search"
          hx-get="/rows"
          hx-target="#rows"
          hx-swap="outerHTML"
          hx-trigger="input changed delay:200ms from:find input, change from:find select">
        <label for="q">filter</label>
        <input id="q"
               name="q"
               type="search"
               value="{{ q }}"
               placeholder="artist, title, album, ISRC"
               autocomplete="off" />
        <label for="state">state</label>
        <select id="state" name="state">
            {% for value, label in states %}
                <option value="{{ value }}" {% if value == state %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
        <noscript>
            <button type="submit">filter</button>
        </noscript>
    </form>
    <div class="actions">
        <button hx-post="/resolve"
                hx-target="#job"
                hx-swap="innerHTML"
                hx-disabled-elt="this">resolve unresolved tracks</button>
    </div>
    <div id="job" aria-live="polite"></div>
    {% include "rows.html" %}
{% endblock %}
