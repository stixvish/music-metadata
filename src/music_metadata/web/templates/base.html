<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{% block title %}music-metadata{% endblock %}</title>
        <link rel="stylesheet" href="/static/app.css" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.4/htmx.min.js"></script>
    </head>
    <body>
        <a class="skip" href="#main">skip to content</a>
        <nav aria-label="screens">
            {% for href, label in [("/", "library"), ("/review", "review"), ("/isrc", "isrc"), ("/diff", "diff"), ("/acquire", "acquire")] %}
                <a href="{{ href }}"
                   {% if href == current %}aria-current="page"{% endif %}>{{ label }}</a>
            {% endfor %}
        </nav>
        <main id="main">
            {% block content %}{% endblock %}
        </main>
    </body>
</html>
