[formatting]
align_entries = true
# **not** align_comments: the map file is generated by `write_map`, and the
# trailing `# not found` markers sit right after short empty values. aligning
# them across the whole file pushes them past 88 columns and makes the file
# taplo produces differ from the file the pipeline writes — so the check would
# fail on every generated map.
align_comments = false
indent_tables = false
reorder_keys  = false
